<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var theme = localStorage.getItem('bic_theme')
        if (theme === 'dark' || theme === 'light' || theme === 'japan' || theme === 'wedding' || theme === 'blue-night' || theme === 'nathan') {
          document.documentElement.setAttribute('data-theme', theme)
        }
        var font = localStorage.getItem('bic_font')
        if (font) document.documentElement.setAttribute('data-font', font)
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0606" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf6ed" media="(prefers-color-scheme: light)" />
    <title>Bible in Context</title>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
